<!doctype html>
<html lang="en">


<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

  {% if messages %}
  <div class="alert alert-primary" role="alert">
      {% for message in messages %}
       {{ message }}

      {%{% endfor %}%}
</div>
{% endif %}

<form
class="col-6 mx-auto card p-3 shadow"
style="background-color:#c4c1e0;"
method="POST"
action="{% url 'login_public' %}">

{% csrf_token %}

  <div class="mb-3">
    <label for="exampleInputText" class="form-label">User Name</label>
    <input type="text" class="form-control"name="username" id="exampleInputText" aria-describedby="textHelp">
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Password</label>
    <input type="password" class="form-control" name="password"id="exampleInputPassword1">
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
</body>
